<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <title>动漫放送数据面板</title>
    <style>
        :root {
            --primary-color: #D4AF37; --secondary-color: #b08d29; --accent-color: #e5c158;
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.1); --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --text-color: #ffffff; --text-light: rgba(255, 255, 255, 0.5); --badge-bg: rgba(255, 255, 255, 0.05); --badge-text: #D4AF37;
            --broadcasted-bg: rgba(212, 175, 55, 0.15); --broadcasted-text: #D4AF37; --sidebar-width: 200px;
        }
        body { font-family: "Inter", sans-serif; color: var(--text-color); margin: 0; background-color: #050505; display: flex; min-height: 100vh; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.03), transparent 25%); z-index: -1; }
        .announcement-bar { position: fixed; top: 0; left: var(--sidebar-width); right: 0; height: 35px; background: rgba(212, 175, 55, 0.1); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); z-index: 1000; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
        .announcement-label { background: var(--primary-color); color: #000; font-weight: bold; font-size: 0.75em; padding: 0 15px; height: 100%; display: flex; align-items: center; z-index: 2; }
        .announcement-content { display: inline-block; padding-left: 100%; animation: ticker 100s linear infinite; font-size: 0.85em; color: var(--accent-color); }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: var(--glass-bg); backdrop-filter: blur(24px); border-right: 1px solid var(--glass-border); padding: 30px 0; z-index: 1100; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        .day-nav { display: flex; flex-direction: column; gap: 4px; margin: 0; }
        .day-nav-btn { background: transparent; color: var(--text-light); padding: 12px 20px; border-radius: 50px; font-weight: bold; font-size: 0.9em; cursor: pointer; transition: 0.3s; text-decoration: none; display: flex; align-items: center; margin: 4px 12px; position: relative; }
        .day-nav-btn:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
        .day-nav-btn.active { background: linear-gradient(135deg, var(--secondary-color), var(--accent-color)); color: #000; }
        .day-nav-btn.active::after { content: '◀'; position: absolute; right: 10px; color: #000; font-size: 1em; opacity: 0.5; animation: arrowFloat 2s infinite ease-in-out; }
        @keyframes arrowFloat { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
        .today-tag { font-size: 0.6em; margin-left: auto; background: rgba(0,0,0,0.15); padding: 2px 6px; border-radius: 6px; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 60px 30px 25px 30px; box-sizing: border-box; }
        header { text-align: left; margin-bottom: 25px; padding: 25px; background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header-text p { margin: 5px 0 0; }
        .header-sub { font-size: 0.8em; color: var(--text-light); letter-spacing: 1px; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .notif-wrapper { position: relative; z-index: 2000; }
        .notif-trigger { cursor: pointer; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; position: relative; transition: 0.3s; }
        .notif-trigger:hover { background: rgba(255,255,255,0.08); border-color: var(--primary-color); }
        .notif-icon-svg { width: 24px; height: 24px; fill: var(--text-light); transition: 0.3s; }
        .notif-trigger:hover .notif-icon-svg { fill: var(--primary-color); transform: rotate(15deg); }
        .notif-badge { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; background: #ff5252; border-radius: 50%; display: none; box-shadow: 0 0 10px #ff5252; }
        .notif-panel { position: absolute; top: 55px; right: 0; width: 320px; max-height: 450px; background: rgba(10,10,10,0.98); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 1.5rem; display: none; flex-direction: column; overflow: hidden; z-index: 3000; box-shadow: var(--glass-shadow); }
        .notif-panel-header { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; color: var(--primary-color); font-weight: bold; }
        .notif-list { overflow-y: auto; flex: 1; padding: 10px; }
        .notif-item { padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.02); margin-bottom: 8px; font-size: 0.85em; display: flex; flex-direction: column; gap: 8px; }
        .refresh-btn { background: linear-gradient(135deg, var(--secondary-color), var(--accent-color)); color: #000; border: none; padding: 10px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .spinning { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .filter-bar { display: inline-flex; gap: 10px; padding: 8px 15px; background: var(--glass-bg); border-radius: 50px; margin-bottom: 25px; border: 1px solid var(--glass-border); }
        .filter-btn { background: transparent; color: var(--text-light); border: none; padding: 6px 15px; border-radius: 15px; cursor: pointer; font-size: 0.85em; }
        .filter-btn.active { background: #fff; color: #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
        .card { background: var(--glass-bg); border-radius: 2rem; overflow: hidden; transition: 0.4s; display: flex; flex-direction: column; border: 1px solid var(--glass-border); position: relative; min-height: 420px; }
        .card.is-highlighted { border-color: var(--primary-color); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .card.is-grayed { opacity: 0.6; filter: grayscale(0.8); }
        .card-img-wrapper { height: 280px; overflow: hidden; background: #111; display: flex; align-items: center; justify-content: center; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img { transform: scale(1.1); }
        .card-content { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; gap: 8px; }
        .card-title { font-size: 1em; font-weight: bold; color: var(--primary-color); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.8em; cursor: pointer; }
        .card-info { display: flex; justify-content: space-between; font-size: 0.85em; align-items: center; }
        .card-time { font-weight: bold; color: var(--accent-color); }
        .time-status { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--glass-border); }
        .card-new-ribbon { position: absolute; top: 0; right: 0; width: 70px; height: 70px; overflow: hidden; z-index: 20; display: none; }
        .card-new-ribbon span { position: absolute; display: block; width: 100px; padding: 4px 0; background: linear-gradient(135deg, #ff5252, #f48fb1); color: #fff; font-size: 10px; font-weight: 900; text-align: center; right: -25px; top: 15px; transform: rotate(45deg); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .status-badge { margin-top: auto; background: var(--badge-bg); color: var(--badge-text); padding: 10px; border-radius: 12px; font-size: 0.8em; text-align: center; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s; }
        .status-badge:hover { background: rgba(255,255,255,0.08); border-color: var(--primary-color); }
        .source-tag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); color: var(--primary-color); border: 1px solid var(--primary-color); padding: 3px 10px; border-radius: 6px; font-size: 0.7em; z-index: 10; font-weight: bold; backdrop-filter: blur(5px); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4000; justify-content: center; align-items: center; backdrop-filter: blur(12px); }
        .modal-content { background: rgba(10,10,10,0.9); width: 95%; max-width: 1100px; max-height: 85vh; border-radius: 2rem; display: flex; flex-direction: column; border: 1px solid var(--glass-border); backdrop-filter: blur(24px); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .resource-item { display: flex; align-items: center; background: rgba(255,255,255,0.03); margin-bottom: 10px; padding: 12px; border-radius: 10px; position: relative; gap: 15px; }
        .is-new-resource { border: 1px solid var(--primary-color); background: rgba(212,175,55,0.05); }
        .res-new-tag { position: absolute; top: -5px; left: -5px; background: linear-gradient(135deg, #ff5252, #f48fb1); color: #fff; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #111; color: var(--primary-color); padding: 12px 25px; border-radius: 30px; z-index: 5000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold; }
        .loading { padding: 40px; text-align: center; color: var(--primary-color); font-size: 1.1em; }
        .day-title { color: var(--primary-color); background: var(--glass-bg); padding: 8px 18px; border-radius: 10px; font-family: var(--font-serif); font-style: italic; display: inline-block; margin-bottom: 25px; }
        .sound-select-wrap { padding: 12px 15px; background: rgba(212, 175, 55, 0.05); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 10px; }
        .sound-select { background: #111; color: var(--primary-color); border: 1px solid var(--glass-border); border-radius: 6px; font-size: 0.75em; padding: 4px 8px; outline: none; cursor: pointer; flex: 1; }
        .notif-badge-type { font-size: 0.65em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-anime { background: rgba(212, 175, 55, 0.2); color: var(--primary-color); border: 1px solid var(--primary-color); }
        .badge-group { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #81c784; }
        .sg-title { font-size: 1em; color: #000; background: linear-gradient(90deg, var(--secondary-color), var(--accent-color)); padding: 10px 15px; margin: 0; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; }
        .sg-section { margin-bottom: 20px; background: var(--glass-bg); border-radius: 12px; border: 1px solid var(--glass-border); }
        .resource-list { padding: 12px; }
        .magnet-btn { background: linear-gradient(135deg, var(--secondary-color), var(--accent-color)); color: #000; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: bold; white-space: nowrap; }
        .group-new-badge { background: #000; color: var(--primary-color); font-size: 0.7em; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--primary-color); }
        @media (max-width: 768px) { .sidebar { width: 100%; height: auto; position: relative; } .main-content { margin-left: 0; padding: 50px 15px; } .day-nav { flex-direction: row; overflow-x: auto; } }
    </style>
</head>
<body>
    <div class="announcement-bar"><div class="announcement-label">📢 更新快讯</div><div class="announcement-content" id="announcementText">正在等待番剧更新推送...</div></div>
    <aside class="sidebar"><nav class="day-nav" id="dayNav"></nav></aside>
    <main class="main-content">
        <header><div class="header-text"><h1>动漫放送数据面板</h1><p class="header-sub">Weekly Schedule & Subtitle Updates</p><p id="lastSync" style="font-size:0.7em;color:var(--accent-color);margin-top:5px;opacity:0.8;"></p></div><div class="header-actions"><div class="notif-wrapper"><div class="notif-trigger" onclick="toggleNotifPanel(event)"><svg class="notif-icon-svg" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><div class="notif-badge" id="notifBadge"></div></div><div class="notif-panel" id="notifPanel" onclick="event.stopPropagation()"><div class="notif-panel-header"><span>更新动态</span><span onclick="clearNotifs(event)" style="cursor:pointer;opacity:0.6;">全部已读</span></div><div class="sound-select-wrap"><label>提示音:</label><select class="sound-select" id="soundSelect" onchange="changeSound(this.value)"><option value="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">默认音效</option><option value="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3">清脆铃声</option><option value="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3">和弦提示</option><option value="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3">动漫短促</option></select></div><div class="notif-list" id="notifList"></div></div></div><button class="refresh-btn" id="refreshBtn" onclick="fetchData(true)">🔄 刷新数据</button></div></header>
        <div class="filter-bar"><button class="filter-btn active" data-filter="all" onclick="filterCards('all')">全部</button><button class="filter-btn" data-filter="broadcasted" onclick="filterCards('broadcasted')">已放送</button><button class="filter-btn" data-filter="unbroadcasted" onclick="filterCards('unbroadcasted')">未放送</button><button class="filter-btn" data-filter="upcoming" onclick="filterCards('upcoming')">待放送</button></div>
        <div id="app"><div class="loading">正在同步云端数据...</div></div>
    </main>
    <div class="modal-overlay" id="detailModal"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle" style="color:var(--primary-color);margin:0;">资源列表</h3><button onclick="closeModal()" style="background:none;border:none;color:#fff;cursor:pointer;font-size:1.5em;">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>
    <div class="toast" id="toast"></div>
    <audio id="updateSound" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let previousDataState = null, notificationHistory = [];
        let currentAnimeId = null, currentAnimeUpdateTime = null;
        const dayMapNames = { 'monday': '周一', 'tuesday': '周二', 'wednesday': '周三', 'thursday': '周四', 'friday': '周五', 'saturday': '周六', 'sunday': '周日', 'recent': '最新上映（近期）' };
        const currentDayMapping = { 1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday', 6: 'saturday', 0: 'sunday' };
        const socket = io();
        const savedSound = localStorage.getItem('notifSound');
        if (savedSound) { document.getElementById('updateSound').src = savedSound; document.getElementById('soundSelect').value = savedSound; }
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        const escapeJsArg = (value) => escapeHtml(JSON.stringify(String(value ?? '')).replace(/[<>\u2028\u2029]/g, ch => ({ '<': '\\u003C', '>': '\\u003E', '\u2028': '\\u2028', '\u2029': '\\u2029' }[ch])));
        const safeImageUrl = (value) => {
            const url = String(value ?? '').trim();
            return /^(https?:)?\/\//i.test(url) || url.startsWith('/') ? escapeHtml(url) : '';
        };
        
        socket.on('new_update', (updates) => {
            const sound = document.getElementById('updateSound'); if(sound) sound.play().catch(e=>{});
            document.getElementById('notifBadge').style.display = 'block';
            updates.forEach(u => { if (!notificationHistory.some(n => n.title === u.title && n.episode === u.episode)) notificationHistory.unshift(u); });
            notificationHistory = notificationHistory.slice(0, 20);
            updateNotifList();
            const msg = updates.map(u => `【新】${u.title} - 第 ${u.episode || 1} 集 (${u.groupName || '资源更新'})`).join(' | ');
            document.getElementById('announcementText').innerText = msg;
            fetchData(false);
        });
        function changeSound(val) { const s = document.getElementById('updateSound'); if (s) { s.src = val; localStorage.setItem('notifSound', val); s.currentTime = 0; s.play().catch(e => {}); showNotification("音效已切换"); } }
        function toggleNotifPanel(e) { e.stopPropagation(); const p = document.getElementById('notifPanel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; if (p.style.display === 'none') document.getElementById('notifBadge').style.display = 'none'; }
        function clearNotifs(e) { if (e) e.stopPropagation(); notificationHistory = []; updateNotifList(); document.getElementById('notifBadge').style.display = 'none'; }
        function updateNotifList() {
            const list = document.getElementById('notifList'); if (!list) return;
            if (notificationHistory.length === 0) { list.innerHTML = '<div class="notif-empty">暂无新动态</div>'; return; }
            list.innerHTML = notificationHistory.map(item => `<div class="notif-item"><div class="notif-header"><span class="notif-badge-type badge-anime">番剧</span><div style="font-size:0.85em;font-weight:bold;flex:1;">${escapeHtml(item.title)}</div></div><div style="display:flex;justify-content:space-between;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;font-size:0.75em;"><span style="color:var(--accent-color);font-weight:bold;">第 ${escapeHtml(item.episode || '1')} 集 <span style="color:var(--text-light);margin:0 5px;opacity:0.5;">|</span> <span class="notif-badge-type badge-group">组</span> <span style="font-style:italic;color:var(--text-light);">${escapeHtml(item.groupName || '最新资源')}</span></span></div></div>`).join('');
        }
        function showNotification(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 5000); }
        function getCurrentDayKey() { 
            const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' })); 
            let d = now.getDay(); 
            // 移除凌晨4点偏移逻辑，实现00:00准时切换
            return ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][d]; 
        }
        function getBroadcastStatus(dayKey, timeStr) {
            if (!timeStr || !timeStr.includes(':') || dayKey === 'recent') return null;
            const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' })); const [h, m] = timeStr.split(':').map(Number);
            const currentDay = now.getDay() === 0 ? 7 : now.getDay(); const iDay = { 'monday': 1, 'tuesday': 2, 'wednesday': 3, 'thursday': 4, 'friday': 5, 'saturday': 6, 'sunday': 7 }[dayKey];
            let passed = false; if (currentDay > iDay) passed = true; else if (currentDay === iDay && (now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m))) passed = true;
            return passed ? { text: '已放送' } : { text: '未放送' };
        }
        function scrollToToday() {
            const today = getCurrentDayKey();
            const target = document.getElementById(`section-${today}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function checkForUpdates(newData) {
            const today = getCurrentDayKey();
            // 如果日期跨天了，执行自动跳转
            if (previousDataState && previousDataState._currentDay !== today) {
                setTimeout(scrollToToday, 500);
            }
            
            if (!previousDataState || !newData) { 
                previousDataState = JSON.parse(JSON.stringify(newData)); 
                previousDataState._currentDay = today;
                return; 
            }
            let found = [];
            Object.keys(newData).forEach(day => { newData[day].forEach(item => { if (item.subtitleUpdates) { const oldItem = (previousDataState[day] || []).find(o => o.title === item.title); if (!oldItem || !oldItem.subtitleUpdates || oldItem.subtitleUpdates.updateTime !== item.subtitleUpdates.updateTime) found.push(item); } }); });
            if (found.length > 0) { const s = document.getElementById('updateSound'); if (s) { s.currentTime = 0; s.play().catch(e => {}); } document.getElementById('notifBadge').style.display = 'block'; found.forEach(item => { if (!notificationHistory.some(n => n.title === item.title && n.episode === item.episode)) { notificationHistory.unshift(item); showNotification(`【更新】${item.title} (第 ${item.episode || 1} 集)`); } }); updateNotifList(); }
            previousDataState = JSON.parse(JSON.stringify(newData));
            previousDataState._currentDay = today;
        }
        async function fetchData(force = false) {
            const btn = document.getElementById('refreshBtn'); 
            const originalText = btn.innerHTML;
            if (force) {
                btn.classList.add('spinning');
                btn.innerText = '🔄 正在同步...';
            }
            try {
                const res = await fetch(`/api/schedule${force ? '?force=true' : ''}`); const result = await res.json();
                if (result.success) { 
                    const isInitialLoad = !previousDataState;
                    checkForUpdates(result.data); 
                    renderData(result.data); 
                    if (isInitialLoad) setTimeout(scrollToToday, 800); 
                    
                    if (result.lastUpdate) {
                        const lastSyncEl = document.getElementById('lastSync');
                        lastSyncEl.innerText = `数据源同步: ${new Date(result.lastUpdate).toLocaleTimeString()}`;
                        if (force) {
                            lastSyncEl.style.color = '#fff';
                            setTimeout(() => lastSyncEl.style.color = 'var(--accent-color)', 1000);
                        }
                    }
                    if (force) showNotification("✨ 云端数据已全量同步");
                }
            } catch (e) { 
                console.error(e); 
                if (force) showNotification("❌ 同步失败，请稍后重试");
            } finally { 
                btn.classList.remove('spinning'); 
                btn.innerHTML = originalText;
            }
        }
        function handleImgError(img) { if (!img) return; img.onerror = null; img.src = 'https://images.unsplash.com/photo-1578632292335-df3abbb0d586?q=80&w=500&auto=format&fit=crop'; img.style.filter = 'grayscale(1) opacity(0.3)'; }
        function renderData(data) {
            const app = document.getElementById('app'), nav = document.getElementById('dayNav'); 
            if (!app || !nav || !data) return;
            app.innerHTML = nav.innerHTML = ''; const today = getCurrentDayKey();
            Object.keys(dayMapNames).forEach(key => {
                if (!data[key]) return;
                const navBtn = document.createElement('a'); navBtn.className = 'day-nav-btn' + (key === today ? ' active' : ''); navBtn.innerHTML = `<span>${dayMapNames[key]}</span>${key === today ? '<span class="today-tag">TODAY</span>' : ''}`;
                navBtn.onclick = (e) => { e.preventDefault(); document.getElementById(`section-${key}`).scrollIntoView({ behavior: 'smooth' }); };
                nav.appendChild(navBtn);
                const section = document.createElement('div'); section.className = 'day-section'; section.id = `section-${key}`;
                section.innerHTML = `<h2 class="day-title">${dayMapNames[key]}${key === today ? ' (今天)' : ''}</h2>`;
                const grid = document.createElement('div'); grid.className = 'grid';
                (data[key] || []).forEach(item => {
                    const card = document.createElement('div'); card.className = 'card'; const b = getBroadcastStatus(key, item.time), isToday = (key === today);
                    
                    const hasUpdates = !!item.subtitleUpdates;
                    if (key !== 'recent') { 
                        if (isToday && ((b && b.text === '已放送') || (!b && hasUpdates))) card.classList.add('is-highlighted'); 
                        else card.classList.add('is-grayed'); 
                    }
                    if (key === 'recent') card.dataset.status = 'all'; else if (!b) card.dataset.status = 'upcoming'; else card.dataset.status = b.text === '已放送' ? 'broadcasted' : 'unbroadcasted';
                    let showRibbon = false; if (item.subtitleUpdates) { const lastRead = localStorage.getItem(`read_${item.mikanId || item.title}`); if (lastRead !== item.subtitleUpdates.updateTime) showRibbon = true; }
                    const titleArg = escapeJsArg(item.title);
                    const mikanIdArg = escapeJsArg(item.mikanId);
                    const updateTimeArg = escapeJsArg(item.subtitleUpdates ? item.subtitleUpdates.updateTime : '');
                    const episodeArg = escapeJsArg(item.episode);
                    const targetEpText = item.episode ? `第 ${item.episode} 话` : '最新话';
                    const badgeTitle = item.subtitleUpdates ? `${item.groupName || '字幕组'}已更新 (${targetEpText})` : `手动查找 ${targetEpText}`;
                    const badgeSub = item.subtitleUpdates ? item.subtitleUpdates.updateTime : '后台未发现精确匹配，点击手动查找';
                    if (item.mikanId) card.dataset.animeId = item.mikanId;
                    card.innerHTML = `<div class="card-new-ribbon" style="display: ${showRibbon ? 'block' : 'none'}"><span>NEW</span></div><div class="card-img-wrapper"><span class="source-tag">${escapeHtml(item.source || 'AniBK')}</span><img src="${safeImageUrl(item.img)}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1578632292335-df3abbb0d586?q=80&w=500&auto=format&fit=crop';this.style.filter='grayscale(1) opacity(0.3)';"></div><div class="card-content"><h3 class="card-title" onclick="copyText(${titleArg}, '已复制名称')">${escapeHtml(item.title)}</h3><div class="card-info"><span style="font-weight:bold;color:var(--accent-color);">${escapeHtml(item.ep || '')}</span><div style="display:flex;align-items:center;"><span style="color:var(--text-light);font-weight:bold;">${escapeHtml(item.time || '')}</span>${b ? `<span class="time-status" style="margin-left:8px;font-size:0.7em;padding:2px 6px;border-radius:4px;border:1px solid var(--glass-border);background:var(--broadcasted-bg);color:var(--broadcasted-text);">${escapeHtml(b.text)}</span>` : ''}</div></div>${item.mikanId ? `<div class="status-badge" onclick="openSubgroups(${mikanIdArg}, ${titleArg}, ${updateTimeArg}, ${episodeArg})"><b>${escapeHtml(badgeTitle)}</b><br><small style="opacity:0.6">${escapeHtml(badgeSub)}</small></div>` : '<div class="status-badge" style="opacity:0.5;">暂无匹配资源</div>'}</div>`;
                    grid.appendChild(card);
                });
                section.appendChild(grid); app.appendChild(section);
            });
            const filter = document.querySelector('.filter-btn.active'); if (filter) filterCards(filter.dataset.filter);
        }
        async function openSubgroups(id, title, updateTime, targetEp) {
            currentAnimeId = id; currentAnimeUpdateTime = updateTime; document.getElementById('modalTitle').innerText = title; const body = document.getElementById('modalBody'); document.getElementById('detailModal').style.display = 'flex';
            body.innerHTML = '<div class="loading">正在拉取磁力链接...</div>';
            try {
                const res = await fetch(`/api/subtitles/${id}`); const result = await res.json();
                if (result.success && result.data.length) {
                    const targetEpNum = parseInt(targetEp) || 0;
                    let html = `<div style="margin-bottom:15px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.05);padding:12px;border-radius:12px;border:1px solid var(--glass-border);"><label style="color:var(--primary-color);font-weight:bold;cursor:pointer;"><input type="checkbox" onchange="toggleAllMagnets(this)" style="transform:scale(1.2);margin-right:8px;"> 全选</label><button class="magnet-btn" style="margin-left:auto;background:linear-gradient(135deg, #4caf50, #81c784);color:#000;" onclick="copySelected()">复制选中</button></div>`;
                    const extractEp = (t) => {
                        let m = t.match(/\[(\d{1,4})(?:v\d+)?\]/i) || t.match(/第\s*(\d{1,4})\s*[话話集]/i) || t.match(/(?:EP|Episode)\s*(\d{1,4})/i) || t.match(/-\s*(\d{1,4})(?:\s|v\d|\[|\.|$)/i) || t.match(/\[\d{1,4}-(\d{1,4})\]/i);
                        if (m) return parseInt(m[1]);
                        m = t.match(/(?:\s|^)(\d{2,4})(?:v\d+)?(?:\s|\.|\[|\(|$)/i);
                        return m ? parseInt(m[1]) : null;
                    };
                    result.data.forEach(group => {
                        const hasNew = group.resources.some(r => extractEp(r.title) === targetEpNum);
                        html += `<div class="sg-section"><h4 class="sg-title"><span>${escapeHtml(group.groupName || '其他资源')}</span>${hasNew ? '<span class="group-new-badge">包含第 '+escapeHtml(targetEpNum)+' 话</span>' : ''}</h4><div class="resource-list">`;
                        group.resources.forEach(r => {
                            const isNew = extractEp(r.title) === targetEpNum;
                            const magnet = String(r.magnet ?? '').trim();
                            html += `<div class="resource-item ${isNew ? 'is-new-resource' : ''}" style="cursor:pointer;" onclick="const cb = this.querySelector('.magnet-checkbox'); if(event.target.tagName !== 'BUTTON' && event.target !== cb) cb.checked = !cb.checked;">${isNew ? '<span class="res-new-tag">TARGET</span>' : ''}<input type="checkbox" class="magnet-checkbox" value="${escapeHtml(magnet)}" style="transform:scale(1.2);cursor:pointer;"><div style="flex:1;margin-left:12px;"><div class="resource-title">${escapeHtml(r.title)}</div><small style="opacity:0.6;">💾 ${escapeHtml(r.size)} | 🕒 ${escapeHtml(r.time)}</small></div><button class="magnet-btn" onclick="copyText(${escapeJsArg(magnet)}, '磁力已复制')">复制</button></div>`;
                        }); html += '</div></div>';
                    }); body.innerHTML = html;
                } else body.innerHTML = '暂无详情';
            } catch (e) { body.innerHTML = '加载失败'; }
        }
        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
        function toggleAllMagnets(cb) { document.querySelectorAll('.magnet-checkbox').forEach(c => c.checked = cb.checked); }
        function copySelected() { const checks = document.querySelectorAll('.magnet-checkbox:checked'); if (!checks.length) return showNotification("请先选择资源"); copyText(Array.from(checks).map(c => c.value.trim()).join('\\n\\n'), `已复制 ${checks.length} 条磁力`); markUpdateRead(); }
        function markUpdateRead() { if (currentAnimeId && currentAnimeUpdateTime) { localStorage.setItem(`read_${currentAnimeId}`, currentAnimeUpdateTime); const r = document.querySelector(`.card[data-anime-id="${currentAnimeId}"] .card-new-ribbon`); if (r) r.style.display = 'none'; } }
        async function copyText(text, msg) { text = String(text ?? ''); try { await navigator.clipboard.writeText(text); showNotification(msg); } catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showNotification(msg); } if (text.startsWith('magnet:')) markUpdateRead(); }
        function filterCards(type) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === type)); document.querySelectorAll('.day-section').forEach(s => { let has = false; s.querySelectorAll('.card').forEach(c => { const v = (type === 'all' || c.dataset.status === type); c.style.display = v ? 'flex' : 'none'; if (v) has = true; }); s.style.display = has ? 'block' : 'none'; }); }
        window.onclick = (e) => { if (e.target.id === 'detailModal') closeModal(); if (document.getElementById('notifPanel').style.display === 'flex' && !e.target.closest('.notif-wrapper')) document.getElementById('notifPanel').style.display = 'none'; };
        function handleImgError(img) { img.onerror = null; img.src = 'https://images.unsplash.com/photo-1578632292335-df3abbb0d586?q=80&w=500&auto=format&fit=crop'; img.style.filter = 'grayscale(1) opacity(0.3)'; }
        fetchData(); setInterval(() => fetchData(false), 180000);
    </script>
</body>
